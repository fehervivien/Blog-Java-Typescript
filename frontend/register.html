<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regisztráció • DevLog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css">
</head>
<body class="bg-slate-50 text-slate-900 antialiased min-h-screen flex flex-col">

<!-- Közös navigációs sáv -->
<nav class="sticky top-0 z-10 bg-white/85 backdrop-blur-md border-b border-slate-200 py-3 px-6">
    <div class="max-w-3xl mx-auto flex justify-between items-center w-full">
        <!-- Logó -->
        <a href="/" class="text-xl font-bold text-slate-900 flex items-center gap-2 decoration-transparent hover:opacity-80 transition-opacity">
            DevLog
            <span class="bg-indigo-50 text-indigo-600 text-xs px-2.5 py-1 rounded-full font-semibold">Full-Stack</span>
        </a>

        <!-- Jobb oldali gombok -->
        <div class="flex gap-2">
            <a href="/login.html" class="border border-slate-200 bg-white text-slate-700 hover:bg-slate-50 font-semibold py-1.5 px-3 rounded-md text-sm transition-colors decoration-transparent">Belépés</a>
            <a href="/register.html" class="bg-indigo-600 text-white hover:bg-indigo-700 font-semibold py-1.5 px-3 rounded-md text-sm transition-colors decoration-transparent">Regisztráció</a>
        </div>
    </div>
</nav>

<!-- Középre igazított űrlap -->
<main class="flex-grow flex items-center justify-center p-4">
    <div class="w-full max-w-[420px]">
        <div class="bg-white border border-slate-200 rounded-xl shadow-sm p-8">
            <h2 class="text-2xl font-bold mb-6 text-slate-900">Fiók létrehozása</h2>

            <form id="register-form">
                <div class="flex flex-col gap-1.5 mb-4">
                    <label for="reg-username" class="text-sm font-semibold text-slate-700">Felhasználónév</label>
                    <input type="text" id="reg-username" required autocomplete="username"
                           class="w-full p-2.5 border border-slate-300 rounded-lg bg-slate-50 focus:outline-none focus:border-indigo-600 focus:bg-white transition-colors">
                </div>

                <div class="flex flex-col gap-1.5 mb-4">
                    <label for="reg-email" class="text-sm font-semibold text-slate-700">E-mail cím</label>
                    <input type="email" id="reg-email" required autocomplete="email"
                           class="w-full p-2.5 border border-slate-300 rounded-lg bg-slate-50 focus:outline-none focus:border-indigo-600 focus:bg-white transition-colors">
                </div>

                <div class="flex flex-col gap-1.5 mb-4">
                    <label for="reg-display-name" class="text-sm font-semibold text-slate-700">Megjelenített név</label>
                    <input type="text" id="reg-display-name" placeholder="Pl. Kovács Péter"
                           class="w-full p-2.5 border border-slate-300 rounded-lg bg-slate-50 focus:outline-none focus:border-indigo-600 focus:bg-white transition-colors">
                </div>

                <div class="flex flex-col gap-1.5 mb-2">
                    <label for="reg-password" class="text-sm font-semibold text-slate-700">Jelszó</label>
                    <input type="password" id="reg-password" required minlength="4" autocomplete="new-password"
                           class="w-full p-2.5 border border-slate-300 rounded-lg bg-slate-50 focus:outline-none focus:border-indigo-600 focus:bg-white transition-colors">
                </div>

                <p id="reg-error" class="text-sm text-red-500 mt-2 font-medium" style="display: none;"></p>

                <button type="submit" class="w-full mt-5 bg-indigo-600 text-white font-semibold py-2.5 rounded-lg hover:bg-indigo-700 transition-colors">
                    Regisztráció
                </button>
            </form>

            <div class="mt-6 text-center text-sm text-slate-500">
                Már van fiókod? <a href="/login.html" class="text-indigo-600 font-semibold hover:underline">Jelentkezz be</a>
            </div>
        </div>
    </div>
</main>

<script type="module" src="/src/register.ts"></script>
</body>
</html>
