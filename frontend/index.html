<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevLog • Fejlesztői Blog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css">
</head>

<body class="bg-slate-50 text-slate-900 antialiased pb-16">

<nav class="sticky top-0 z-10 bg-white/85 backdrop-blur-md border-b border-slate-200 mb-8 py-3 px-6">
    <div class="max-w-3xl mx-auto flex justify-between items-center">
        <a href="/" class="text-xl font-bold text-slate-900 flex items-center gap-2 decoration-transparent">
            DevLog
            <span class="bg-indigo-50 text-indigo-600 text-xs px-2.5 py-1 rounded-full font-semibold">Full-Stack</span>
        </a>
        <div id="nav-auth-container"></div>
    </div>
</nav>

<div class="max-w-3xl mx-auto px-4">
    <header class="mb-10 text-left">
        <h1 class="text-3xl font-extrabold tracking-tight mb-2">Gondolatok, kód & architektúra</h1>
        <p class="text-lg text-slate-500">Technológiai cikkek és jegyzetek saját fejlesztésű REST backenddel.</p>
    </header>

    <!-- Új bejegyzés / Szerkesztés űrlap -->
    <section class="bg-white border border-slate-200 rounded-xl shadow-sm p-7 mb-10 border-t-4 border-t-indigo-600">
        <h3 id="form-title" class="text-xl font-bold mb-5 flex items-center gap-2">✍️ Új cikk közzététele</h3>
        <form id="post-form">
            <div class="flex flex-col gap-1.5 mb-4">
                <label for="title" class="text-sm font-semibold text-slate-700">Cím</label>
                <input type="text" id="title" required placeholder="Pl. Miért érdemes Java 21-re frissíteni?"
                       class="w-full p-3 border border-slate-300 rounded-lg bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 focus:bg-white transition-all">
            </div>

            <div class="flex flex-col gap-1.5 mb-4">
                <label for="author" class="text-sm font-semibold text-slate-700">Szerző</label>
                <input type="text" id="author" placeholder="Jelentkezz be a posztoláshoz" disabled
                       class="w-full p-3 border border-slate-300 rounded-lg bg-slate-100 text-slate-500 cursor-not-allowed">
            </div>

            <div class="flex flex-col gap-1.5 mb-5">
                <label for="content" class="text-sm font-semibold text-slate-700">Tartalom</label>
                <textarea id="content" rows="4" required placeholder="Írd le a gondolataidat részletesen..."
                          class="w-full p-3 border border-slate-300 rounded-lg bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 focus:bg-white transition-all resize-y min-h-[110px]"></textarea>
            </div>

            <div class="flex items-center gap-3">
                <button type="submit" id="submit-btn" class="bg-indigo-600 text-white font-semibold px-5 py-2.5 rounded-lg hover:bg-indigo-700 transition-colors">Közzététel</button>
                <button type="button" id="cancel-btn" class="border border-slate-300 text-slate-600 font-semibold px-5 py-2.5 rounded-lg hover:bg-slate-100 hover:text-slate-900 transition-colors" style="display: none;">Mégse</button>
            </div>
        </form>
    </section>

    <!-- Cikkek listája -->
    <main>
        <div class="flex flex-wrap justify-between items-center gap-4 mb-6">
            <h2 class="text-2xl font-bold">Legújabb bejegyzések</h2>
            <div class="flex-1 max-w-[320px]">
                <input type="text" id="search-input" placeholder="🔍 Keresés cím vagy szerző alapján..."
                       class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition-all">
            </div>
        </div>
        <div id="posts-container" class="flex flex-col gap-5">
            <div class="text-center p-12 text-slate-500">Bejegyzések betöltése folyamatban...</div>
        </div>
    </main>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
